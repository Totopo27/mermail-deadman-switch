[package]
name = "mermail-deadman-vault"
version = "0.1.0"
description = "Autonomous Solana Dead Man's Switch Vault Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mermail_deadman_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
